<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Coordinate Converter | VirtuaUtils</title>
    <meta name="description" content="Convert Minecraft Overworld coordinates to Nether coordinates and back instantly.">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --bg: #070b0a;
            --card: rgba(15, 23, 20, 0.82);
            --card-border: rgba(92, 255, 158, 0.12);
            --text: #f1fff6;
            --muted: #91a69a;
            --green: #5cff9e;
            --green-dark: #19a95b;
            --input: #0c1410;
        }
        body {
            min-height: 100vh;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 20% 20%, rgba(44, 255, 135, 0.08), transparent 30%),
                radial-gradient(circle at 80% 70%, rgba(0, 255, 140, 0.06), transparent 30%),
                var(--bg);
            overflow-x: hidden;
        }
        /* Animated background */
        body::before {
            content: "";
            position: fixed;
            inset: -50%;
            z-index: -1;
            background:
                linear-gradient(
                    115deg,
                    transparent 40%,
                    rgba(92, 255, 158, 0.025) 50%,
                    transparent 60%
                );
            animation: backgroundMove 12s linear infinite;
            pointer-events: none;
        }
        @keyframes backgroundMove {
            from {
                transform: translateX(-10%) rotate(0deg);
            }
            to {
                transform: translateX(10%) rotate(360deg);
            }
        }
        /* Navigation */
        nav {
            width: 100%;
            padding: 22px 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            font-size: 21px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .logo span {
            color: var(--green);
        }
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-size: 13px;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 12px var(--green);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.45;
                transform: scale(0.75);
            }
        }
        /* Main */
        main {
            width: min(920px, 92%);
            margin: 70px auto 80px;
        }
        .hero {
            text-align: center;
            margin-bottom: 45px;
            animation: fadeUp 0.8s ease forwards;
        }
        .hero h1 {
            font-size: clamp(38px, 7vw, 68px);
            line-height: 1;
            letter-spacing: -3px;
            margin-bottom: 18px;
        }
        .hero h1 span {
            color: var(--green);
            text-shadow: 0 0 30px rgba(92, 255, 158, 0.25);
        }
        .hero p {
            max-width: 560px;
            margin: auto;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.6;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* Converter card */
        .converter {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 28px;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.025);
            animation: fadeUp 0.9s ease 0.1s both;
        }
        .mode-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 25px;
        }
        .mode {
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.025);
            color: var(--muted);
            padding: 14px;
            border-radius: 13px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.25s ease;
        }
        .mode:hover {
            border-color: rgba(92,255,158,0.25);
            transform: translateY(-1px);
        }
        .mode.active {
            background: rgba(92,255,158,0.09);
            border-color: rgba(92,255,158,0.35);
            color: var(--green);
        }
        .coordinates {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        label {
            display: block;
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 16px;
            border-radius: 13px;
            border: 1px solid rgba(255,255,255,0.07);
            background: var(--input);
            color: var(--text);
            outline: none;
            font-size: 16px;
            transition: 0.25s ease;
        }
        input:focus {
            border-color: rgba(92,255,158,0.55);
            box-shadow: 0 0 0 4px rgba(92,255,158,0.06);
        }
        input::placeholder {
            color: #53635a;
        }
        .convert-button {
            width: 100%;
            margin-top: 18px;
            padding: 16px;
            border: none;
            border-radius: 13px;
            background: var(--green);
            color: #061109;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.25s ease;
            position: relative;
            overflow: hidden;
        }
        .convert-button::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(
                100deg,
                transparent,
                rgba(255,255,255,0.25),
                transparent
            );
            transform: translateX(-100%);
        }
        .convert-button:hover::after {
            animation: shine 0.7s ease;
        }
        .convert-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(92,255,158,0.15);
        }
        .convert-button:active {
            transform: translateY(0);
        }
        @keyframes shine {
            to {
                transform: translateX(100%);
            }
        }
        /* Result */
        .result {
            margin-top: 22px;
            padding: 22px;
            border-radius: 16px;
            background: rgba(92,255,158,0.045);
            border: 1px solid rgba(92,255,158,0.12);
            display: none;
            animation: resultIn 0.4s ease forwards;
        }
        .result.show {
            display: block;
        }
        @keyframes resultIn {
            from {
                opacity: 0;
                transform: scale(0.98) translateY(8px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .result-title {
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 8px;
        }
        .result-coordinates {
            font-size: 28px;
            font-weight: 800;
            color: var(--green);
            letter-spacing: -1px;
        }
        .tip {
            margin-top: 12px;
            color: var(--muted);
            font-size: 12px;
        }
        /* Footer */
        footer {
            text-align: center;
            color: #526158;
            font-size: 12px;
            padding: 0 20px 35px;
        }
        /* Mobile */
        @media (max-width: 600px) {
            nav {
                padding: 18px 5%;
            }
            main {
                margin-top: 45px;
            }
            .hero h1 {
                letter-spacing: -2px;
            }
            .converter {
                padding: 18px;
                border-radius: 19px;
            }
            .coordinates {
                grid-template-columns: 1fr;
            }
            .mode-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">Virtua<span>Utils</span></div>
        <div class="status">
            <div class="status-dot"></div>
            Online
        </div>
    </nav>
    <main>
        <section class="hero">
            <h1>Minecraft <span>Coordinates</span></h1>
            <p>
                Convert coordinates between the Overworld and Nether instantly.
                Fast, simple, and completely free.
            </p>
        </section>
        <section class="converter">
            <div class="mode-buttons">
                <button class="mode active" id="overworldMode">
                    Overworld → Nether
                </button>
                <button class="mode" id="netherMode">
                    Nether → Overworld
                </button>
            </div>
            <div class="coordinates">
                <div>
                    <label for="x">X Coordinate</label>
                    <input
                        id="x"
                        type="number"
                        placeholder="e.g. 1200"
                    >
                </div>
                <div>
                    <label for="z">Z Coordinate</label>
                    <input
                        id="z"
                        type="number"
                        placeholder="e.g. -800"
                    >
                </div>
            </div>
            <button class="convert-button" id="convert">
                Convert Coordinates
            </button>
            <div class="result" id="result">
                <div class="result-title">
                    Converted coordinates
                </div>
                <div class="result-coordinates" id="resultCoordinates">
                    X: 0, Z: 0
                </div>
                <div class="tip">
                    Minecraft uses approximately an 8:1 Overworld-to-Nether ratio.
                </div>
            </div>
        </section>
    </main>
    <footer>
        VirtuaUtils · Minecraft utilities made simple
    </footer>
    <script>
        const overworldMode = document.getElementById("overworldMode");
        const netherMode = document.getElementById("netherMode");
        const convertButton = document.getElementById("convert");
        const xInput = document.getElementById("x");
        const zInput = document.getElementById("z");
        const result = document.getElementById("result");
        const resultCoordinates = document.getElementById("resultCoordinates");
        let mode = "overworld";
        overworldMode.addEventListener("click", () => {
            mode = "overworld";
            overworldMode.classList.add("active");
            netherMode.classList.remove("active");
            result.classList.remove("show");
        });
        netherMode.addEventListener("click", () => {
            mode = "nether";
            netherMode.classList.add("active");
            overworldMode.classList.remove("active");
            result.classList.remove("show");
        });
        convertButton.addEventListener("click", () => {
            const x = Number(xInput.value);
            const z = Number(zInput.value);
            if (xInput.value === "" || zInput.value === "") {
                resultCoordinates.textContent = "Enter both coordinates";
                result.classList.add("show");
                return;
            }
            let convertedX;
            let convertedZ;
            if (mode === "overworld") {
                convertedX = x / 8;
                convertedZ = z / 8;
            } else {
                convertedX = x * 8;
                convertedZ = z * 8;
            }
            resultCoordinates.textContent =
                `X: ${formatNumber(convertedX)}, Z: ${formatNumber(convertedZ)}`;
            result.classList.add("show");
        });
        function formatNumber(number) {
            if (Number.isInteger(number)) {
                return number.toString();
            }
            return number.toFixed(2).replace(/\.?0+$/, "");
        }
        // Press Enter to convert
        document.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                convertButton.click();
            }
        });
    </script>
</body>
</html>
